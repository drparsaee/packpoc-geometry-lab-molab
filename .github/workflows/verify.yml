name: Verify public MoLab mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python geometry contract tests
        run: python -m unittest discover -s tests -v
      - name: Install actual marimo runtime
        run: python -m pip install --disable-pip-version-check "marimo>=0.17,<1"
      - name: Validate actual marimo notebook
        run: marimo check notebooks/geometry_lab.py
      - name: Execute notebook using marimo HTML export
        run: marimo export html notebooks/geometry_lab.py -o mirror-preview.html
      - name: Assert exported HTML exists
        run: test -s mirror-preview.html
